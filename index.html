<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周辺店舗検索ツール</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-search-location"></i> 周辺店舗検索ツール</h1>
            <p>基準店舗の周辺にある店舗を検索できます</p>
        </header>

        <div class="main-content">
            <!-- <div class="search-panel">
                ...（検索パネルの内容をすべてコメントアウト）...
            </div> -->

            <div class="results-panel" id="resultsPanel">
                <div id="loading" class="loading hidden">
                    <div class="spinner"></div>
                    <p>検索中...</p>
                    <div id="searchProgress" class="search-progress">
                        <div class="progress-bar">
                            <div id="progressFill" class="progress-fill"></div>
                        </div>
                        <span id="progressText">0%</span>
                    </div>
                </div>

                <div id="results" class="results hidden">
                    <div class="results-header">
                        <h3 class="results-title">検索結果 <span id="resultCount"></span></h3>
                        <div class="results-summary">
                            <div class="results-stats">
                                <span>総取得: <span id="totalSearched">0</span>件</span>
                                <span>重複率: <span id="duplicateRate">0.0%</span></span>
                                <span id="filterInfo"></span>
                            </div>
                            <div class="results-actions">
                                <button id="exportCsvBtn" class="btn btn-primary"><i class="fas fa-download"></i> CSVエクスポート</button>
                                <button id="showMap" class="btn btn-secondary"><i class="fas fa-map-marked-alt"></i> 地図表示</button>
                                <button id="clearResults" class="btn btn-danger"><i class="fas fa-trash"></i> クリア</button>
                            </div>
                        </div>
                    </div>
                    <div id="resultsTable" class="results-table-container"></div>
                </div>

                <div id="mapContainer" class="map-container hidden">
                    <div id="map"></div>
                </div>
            </div>
        </div>
        
        <!-- スマートフォン用検索パネル切り替えボタン -->
        <!-- <button id="searchToggle" class="search-toggle" title="検索パネルを開く">
            <i class="fas fa-search"></i>
        </button> -->
    </div>

    <script src="script.js"></script>
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD0RZKfd4TulAhsrqyy77fV1iWaWQXP28g&libraries=places&callback=initMap"></script>
</body>
</html>
