version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
        - echo "GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY" > .env
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/* 